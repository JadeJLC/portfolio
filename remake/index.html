<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jade Colanges - Portfolio</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <header>
      <aside>
        <img
          src="ressources/internal-circle.png"
          alt="Cadre intérieur"
          class="rotating-reverse internal-circle"
          aria-hidden="true"
        />
        <img
          src="ressources/external-circle.png"
          alt="Cadre extérieur"
          class="rotating-normal external-circle"
          aria-hidden="true"
        />
        <span class="shiny-font" aria-hidden="true">JC</span>
      </aside>

      <h1 class="shiny-font">
        Jade Colanges
        <span></span>
      </h1>

      <section class="main-buttons">
        <div class="switch-language">
          <button type="button" id="english">🇬🇧 EN</button>
          <button type="button" id="french" class="active">🇫🇷 FR</button>
        </div>
        <div class="contact-info">
          <button type="button">Email</button>
        </div>
        <div class="pro-links">
          <!--Logo Github-->
          <a href="https://github.com/JadeJLC" target="_blank" id="github">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              ></path>
              <path d="M9 18c-4.51 2-5-2-7-2"></path>
            </svg>
          </a>

          <!-- Logo linkedin-->
          <a
            href="https://www.linkedin.com/in/jadejlc/"
            target="_blank"
            id="linkedin"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
              ></path>
              <rect width="4" height="12" x="2" y="9"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
          </a>
        </div>
        <div class="main-menu">
          <button type="button">
            <i data-lucide="menu"></i>
          </button>
          <ul>
            <li id="menu_bio"></li>
            <li id="menu_skills"></li>
            <li id="menu_projects"></li>
            <li id="menu_contact"></li>
          </ul>
        </div>
      </section>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 200 170"
        width="100%"
        height="100%"
        aria-hidden="true"
      >
        <!-- All shapes grouped with a single fill color -->
        <g fill="#ebc677">
          <!-- COMPUTER MONITOR -->
          <!-- Outer Screen Frame -->
          <rect x="42" y="15" width="116" height="78" rx="6" />

          <!-- Inner Screen Cutout (transparent) -->
          <rect x="52" y="24" width="96" height="54" rx="2" fill="#450629" />

          <!-- Inner Screen Graphics (Nodes & Lines) -->
          <g fill="#ebc677">
            <!-- Top Line and Node -->
            <rect x="52" y="37" width="34" height="4" />
            <circle cx="90" cy="39" r="7" />
            <circle cx="90" cy="39" r="3.5" fill="#450629" />

            <!-- Middle Line and Node -->
            <rect x="52" y="49" width="20" height="4" />
            <circle cx="76" cy="51" r="7" />
            <circle cx="76" cy="51" r="3.5" fill="#450629" />

            <!-- Bottom Line and Node -->
            <rect x="52" y="61" width="34" height="4" />
            <circle cx="90" cy="63" r="7" />
            <circle cx="90" cy="63" r="3.5" fill="#450629" />
          </g>

          <!-- Monitor Stand -->
          <path d="M92 93 L88 107 L68 112 L132 112 L112 107 L108 93 Z" />

          <!-- OPEN BOOK -->
          <!-- Left Page -->
          <path
            d="M100 137 C75 117 40 115 28 119 L18 139 C34 135 70 136 100 151 Z"
          />
          <!-- Left Page Ribbon Bookmark Accent (Top) -->
          <path d="M28 108 C45 110 75 113 100 120 C85 116 55 114 28 112 Z" />

          <!-- Right Page -->
          <path
            d="M100 137 C125 117 160 115 172 119 L182 139 C166 135 130 136 100 151 Z"
          />
          <!-- Right Page Ribbon Bookmark Accent (Top) -->
          <path
            d="M172 108 C155 110 125 113 100 120 C115 116 145 114 172 112 Z"
          />

          <!-- Book Base / Cover Stand -->
          <path d="M10 144 H190 V152 H108 C105 157 95 157 92 152 H10 Z" />
        </g>
      </svg>
    </header>

    <script type="module" src="script.js"></script>
  </body>
</html>
