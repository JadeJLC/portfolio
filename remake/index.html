<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jade Colanges - Portfolio</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <aside>
        <img
          src="ressources/internal-circle.png"
          alt="Cadre intérieur"
          class="rotating-reverse internal-circle"
        />
        <img
          src="ressources/external-circle.png"
          alt="Cadre extérieur"
          class="rotating-normal external-circle"
        />
        <span>JC</span>
      </aside>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 200 170"
        width="100%"
        height="100%"
      >
        <!-- All shapes grouped with a single fill color -->
        <g fill="#ebc677">
          <!-- COMPUTER MONITOR -->
          <!-- Outer Screen Frame -->
          <rect x="42" y="15" width="116" height="78" rx="6" />

          <!-- Inner Screen Cutout (transparent) -->
          <rect x="52" y="24" width="96" height="54" rx="2" fill="#450629" />

          <!-- Inner Screen Graphics (Nodes & Lines) -->
          <g fill="#ebc677">
            <!-- Top Line and Node -->
            <rect x="52" y="37" width="34" height="4" />
            <circle cx="90" cy="39" r="7" />
            <circle cx="90" cy="39" r="3.5" fill="#450629" />

            <!-- Middle Line and Node -->
            <rect x="52" y="49" width="20" height="4" />
            <circle cx="76" cy="51" r="7" />
            <circle cx="76" cy="51" r="3.5" fill="#450629" />

            <!-- Bottom Line and Node -->
            <rect x="52" y="61" width="34" height="4" />
            <circle cx="90" cy="63" r="7" />
            <circle cx="90" cy="63" r="3.5" fill="#450629" />
          </g>

          <!-- Monitor Stand -->
          <path d="M92 93 L88 107 L68 112 L132 112 L112 107 L108 93 Z" />

          <!-- OPEN BOOK -->
          <!-- Left Page -->
          <path
            d="M100 137 C75 117 40 115 28 119 L18 139 C34 135 70 136 100 151 Z"
          />
          <!-- Left Page Ribbon Bookmark Accent (Top) -->
          <path d="M28 108 C45 110 75 113 100 120 C85 116 55 114 28 112 Z" />

          <!-- Right Page -->
          <path
            d="M100 137 C125 117 160 115 172 119 L182 139 C166 135 130 136 100 151 Z"
          />
          <!-- Right Page Ribbon Bookmark Accent (Top) -->
          <path
            d="M172 108 C155 110 125 113 100 120 C115 116 145 114 172 112 Z"
          />

          <!-- Book Base / Cover Stand -->
          <path d="M10 144 H190 V152 H108 C105 157 95 157 92 152 H10 Z" />
        </g>
      </svg>
    </header>

</html>
